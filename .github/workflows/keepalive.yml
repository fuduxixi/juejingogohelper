name: Keep Actions Alive

on:
  schedule:
    # 每月 1 日 03:17 UTC 产生一次最小提交，保持仓库有活动，
    # 避免公开仓库 60 天无活动导致 schedule 被 GitHub 自动停用。
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep default branch active
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Update heartbeat
        run: |
          printf 'Last keepalive: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/keepalive.txt
          if git diff --quiet -- .github/keepalive.txt; then
            echo "No heartbeat change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keep scheduled actions active"
          git push
